[package]
name = "osg-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A fast local-first subtitle creation application"
license = "MIT"
default-run = "osg-desktop"

[lib]
name = "osg_desktop_lib"
# Every shipped target in this repository enters through `src/main.rs`. Emitting mobile ABI library
# forms made each Windows edit link an unused ~218 MiB static library and a DLL before linking the
# executable. A future mobile target should add a thin mobile wrapper package instead of taxing all
# desktop builds with artifact kinds that have no consumer.
crate-type = ["rlib"]

[features]
default = []
production = ["tauri/custom-protocol"]
ci-updater-fixture = []
# An unsigned build for local testing only. It is packaged exactly like a release — it must carry
# `tauri/custom-protocol` or the binary keeps the development URL — and differs in one respect: it
# makes NO update request. It is kept out of releases by the CI build command and by a readiness
# assertion over that command, and it announces itself in the `app.environment` diagnostic so an
# installed build can be identified from its own log rather than from what someone remembers.
unsigned-local-build = ["tauri/custom-protocol", "tauri/devtools"]
# Automation channel. Carries an embedded WebDriver server so a test can drive the real binary with
# no external driver and therefore no ambiguity about which WebView target it attached to. It has
# the packaged custom protocol but deliberately does NOT inherit `unsigned-local-build`: that channel
# enables DevTools, whose accelerator can create an interactive native window. Like every test-only
# channel, this is built by no release workflow and asserted absent from release artifacts.
e2e-automation = [
  "tauri/custom-protocol",
  "dep:tauri-plugin-wdio-webdriver",
  "dep:tauri-plugin-wdio",
  "osg-download/e2e-automation",
]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
atomicwrites.workspace = true
base64.workspace = true
blake3.workspace = true
fs2.workspace = true
futures-util.workspace = true
minisign-verify = "=0.2.5"
osg-application.workspace = true
osg-asr.workspace = true
osg-compositor.workspace = true
osg-decode.workspace = true
osg-domain.workspace = true
osg-download.workspace = true
osg-encode.workspace = true
osg-engine-packages.workspace = true
osg-export.workspace = true
osg-formats.workspace = true
osg-gemini.workspace = true
osg-infrastructure.workspace = true
osg-live-music.workspace = true
osg-media.workspace = true
osg-media-pipeline.workspace = true
osg-media-server.workspace = true
osg-native-tools.workspace = true
osg-providers.workspace = true
osg-render.workspace = true
osg-runtime-staging.workspace = true
osg-scene.workspace = true
osg-speech.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls"] }
rfd = { version = "=0.16.0", default-features = false }
same-file.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { path = "../../../vendor/tauri-plugin-wdio-webdriver", optional = true }
tauri-plugin-window-state = "=2.4.1"
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[lints]
workspace = true
