[[permission]]
identifier = "read-session"
description = "Allows the main window to read application health and the current editing session."
commands.allow = ["app_health", "get_session_snapshot"]

[[permission]]
identifier = "select-local-files"
description = "Allows the native media picker to import, release, and reopen authorized media without exposing paths."
commands.allow = ["select_media", "clear_media", "open_media_asset"]

[[permission]]
identifier = "use-native-media-drop"
description = "Allows the main editor to receive sanitized native drag coordinates and redeem one-time path-free media offers."
commands.allow = [
  "media_drop_subscribe",
  "media_drop_unsubscribe",
  "media_drop_discard",
  "media_drop_claim",
]

[[permission]]
identifier = "manage-settings"
description = "Allows the main window to read and update non-secret application preferences."
commands.allow = [
  "setting_get",
  "setting_set",
  "settings_set_many",
  "setting_delete",
  "settings_clear",
]

[[permission]]
identifier = "manage-cache"
description = "Allows the main window to inspect and clear path-free application cache categories."
commands.allow = ["cache_info", "cache_clear", "cache_prune_expired"]

[[permission]]
identifier = "download-media"
description = "Allows the main editor to inspect supported public media URLs and run bounded native downloads without exposing paths or process arguments."
commands.allow = [
  "download_status",
  "download_inspect",
  "download_start",
  "download_cancel",
]

[[permission]]
identifier = "manage-projects"
description = "Allows the main editor window to create, load, and navigate path-free project and editor-track revisions."
commands.allow = [
  "project_create",
  "project_load",
  "project_history_status",
  "project_track_history_status",
  "project_commit",
  "project_track_commit",
  "project_undo",
  "project_redo",
  "project_track_undo",
  "project_track_redo",
]

[[permission]]
identifier = "manage-jobs"
description = "Allows the main editor window to inspect and cancel durable background jobs."
commands.allow = ["jobs_list", "job_get", "job_cancel"]

[[permission]]
identifier = "manage-credentials"
description = "Allows the main window to create, delete, and inspect safe metadata for native credentials. Secret values can only be submitted, never read back."
commands.allow = [
  "credential_set",
  "credential_upsert",
  "credential_delete",
  "credential_status",
]

[[permission]]
identifier = "use-native-providers"
description = "Allows the main window to fetch Genius lyrics and public YouTube metadata through bounded native clients, and to manage a system-browser YouTube OAuth session using only opaque credential references."
commands.allow = [
  "genius_lyrics",
  "youtube_search",
  "youtube_video_details",
  "youtube_thumbnail",
  "youtube_oauth_authorize",
  "youtube_oauth_cancel",
  "youtube_oauth_status",
  "youtube_oauth_clear",
]

[[permission]]
identifier = "import-legacy-data"
description = "Allows the main window to open a native folder picker and migrate bounded legacy settings, credentials, and artifacts without exposing source paths."
commands.allow = ["legacy_import_select", "legacy_import_status"]

[[permission]]
identifier = "run-gemini"
description = "Allows the main editor window to start bounded native Gemini media jobs using opaque credential references."
commands.allow = ["gemini_start"]

[[permission]]
identifier = "generate-images"
description = "Allows the main editor to import a bounded ephemeral reference image and run native Gemini image generation without exposing credentials or paths."
commands.allow = ["image_blob_import", "image_blob_release", "gemini_image_start"]

[[permission]]
identifier = "use-native-live-music"
description = "Allows the main editor to run one bounded native Lyria RealTime session using an opaque credential reference and raw PCM channels."
commands.allow = [
  "live_music_start",
  "live_music_update",
  "live_music_control",
  "live_music_close",
]

[[permission]]
identifier = "import-ephemeral-audio"
description = "Allows the main editor to import and release bounded in-memory audio recordings through opaque media identifiers."
commands.allow = ["media_blob_import", "media_blob_release"]

[[permission]]
identifier = "export-media"
description = "Allows the main editor to choose a native destination and atomically export an opaque media asset without exposing filesystem paths."
commands.allow = ["media_export_start"]

[[permission]]
identifier = "manage-native-tools"
description = "Allows the main editor to inspect, install, remove, and cancel only reviewed content-addressed native tool deliveries without exposing paths or upstream URLs."
commands.allow = [
  "native_tools_catalog",
  "native_tools_status",
  "native_tool_install",
  "native_tool_remove",
  "native_tool_cancel",
]

[[permission]]
identifier = "run-media-pipeline"
description = "Allows the main editor to prepare playback media, create bounded analysis clips, extract audio, and generate waveforms through opaque media identifiers."
commands.allow = [
  "media_pipeline_inspect",
  "media_pipeline_start",
  "media_pipeline_cancel",
]

[[permission]]
identifier = "render-video"
description = "Allows the main editor to start and reconnect to durable native Remotion renders using only opaque media, project, and speech artifact identifiers."
commands.allow = [
  "render_runtime_status",
  "render_start",
  "render_result",
  "render_playback_release",
]

[[permission]]
identifier = "use-local-asr"
description = "Allows the main editor window to inspect installed local ASR engines and start bounded transcription jobs for the active media."
commands.allow = ["asr_status", "asr_start"]

[[permission]]
identifier = "manage-engine-packages"
description = "Allows the main editor to inspect verified local ASR packages, install or remove them, and start or stop their supervised runtimes."
commands.allow = [
  "engine_packages_status",
  "engine_package_install",
  "engine_package_remove",
  "engine_runtime_start",
  "engine_runtime_stop",
]

[[permission]]
identifier = "use-native-speech"
description = "Allows the main editor to inspect supervised speech backends, manage opaque reference audio, run durable narration and voice-conversion jobs, export durable artifacts through native save UI, and resolve scoped playback handles."
commands.allow = [
  "speech_status",
  "speech_probe",
  "speech_runtime_stop",
  "speech_reference_select",
  "speech_reference_extract",
  "speech_reference_import",
  "speech_start",
  "speech_voice_conversion_start",
  "speech_artifact_edit",
  "speech_artifact_export",
  "speech_job_results",
  "speech_alignment_start",
  "speech_alignment_result",
  "speech_artifact_resolve",
  "speech_playback_release",
]

[[permission]]
identifier = "manage-speech-packages"
description = "Allows the main editor to inspect, install, update, and remove only reviewed content-addressed speech runtime packages."
commands.allow = [
  "speech_packages_status",
  "speech_package_install",
  "speech_package_remove",
]

[[permission]]
identifier = "check-for-updates"
description = "Allows the main window to check signed release metadata without exposing update URLs, signatures, or installer controls."
commands.allow = ["app_update_check"]

[[permission]]
identifier = "open-reviewed-external-links"
description = "Allows the main window to open only a closed set of reviewed documentation and account-management links in the system browser."
commands.allow = ["open_external_link"]
