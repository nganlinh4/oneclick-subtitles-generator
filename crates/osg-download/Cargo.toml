[package]
name = "osg-download"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed, SSRF-aware yt-dlp download pipeline for OSG"
license = "MIT"

[features]
default = []
# Compile-time test seam used only by osg-desktop's hidden E2E channel. It does not weaken the
# ordinary validator: callers must opt into a separate constructor with exact, tokenized loopback
# URLs fixed before process launch.
e2e-automation = []

[dependencies]
osg-process.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true

[lints]
workspace = true
