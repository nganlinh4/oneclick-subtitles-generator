[package]
name = "osg-providers"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Bounded backend-only Genius and YouTube provider clients for OSG"

[dependencies]
base64 = "=0.22.1"
dom_query = "=0.27.0"
futures-util = "=0.3.33"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "http2", "json", "rustls", "stream"] }
secrecy = "=0.10.3"
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
thiserror.workspace = true
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
url = "=2.5.8"
zeroize = "=1.9.0"

[dev-dependencies]
static_assertions = "=1.1.0"
wiremock = "=0.6.5"

[lints]
workspace = true
