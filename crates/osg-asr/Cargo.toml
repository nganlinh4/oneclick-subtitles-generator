[package]
name = "osg-asr"
version = "2.0.0"
edition = "2024"
rust-version = "1.97"
description = "Typed, cancellable local ASR worker foundation for OSG"
license = "MIT"

[dependencies]
command-group = "=5.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
