[package]
name = "osg-gemini"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Backend-only, cancellation-safe Gemini media provider for OSG"

[dependencies]
async-stream = "0.3.6"
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = "0.3.31"
httpdate = "1.0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "rustls", "stream"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints]
workspace = true
