[package]
name = "osg-native-tools"
version = "2.0.0"
authors = ["nganlinh4"]
edition = "2024"
rust-version = "1.97"
description = "Content-addressed native tool delivery for OSG"
license = "MIT"

[dependencies]
fs2 = "=0.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
thiserror.workspace = true
url = "=2.5.8"
uuid.workspace = true
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
