[package]
name = "osg-audio"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deterministic audio decoding, resampling and mixing for the OSG native renderer"
license = "MIT"

[dependencies]
osg-scene = { workspace = true }
symphonia = { version = "=0.5.5", default-features = false, features = [
  "aac",
  "flac",
  "isomp4",
  "mkv",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }
# Opus has no pure-Rust decoder in symphonia, and yt-dlp downloads routinely carry it, so without
# this an export of a downloaded video fails outright. `bundled` builds libopus from the vendored
# source cargo already checksums, rather than trusting whatever might be on the machine.
symphonia-adapter-libopus = { version = "=0.2.9", features = ["bundled"] }
thiserror = "=2.0.20"

[lints]
workspace = true
